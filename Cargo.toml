[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Gate, records and guards for agents building one project in parallel git worktrees"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = "1"

[dev-dependencies]
tempfile = "3"
